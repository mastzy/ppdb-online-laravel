version: '3.8'

services:
  # Application Server (Laravel PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ppdb-laravel-app
    container_name: ppdb-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ppdb-network

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: ppdb-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - ppdb-network

  # Database Server (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: ppdb-db
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ppdb_online}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ppdb-network

networks:
  ppdb-network:
    driver: bridge

volumes:
  pgdata:
    driver: local