version: '3.8'

services:
  # Laravel PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ppdb-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ppdb-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # NGINX Web Server
  webserver:
    image: nginx:1.24-alpine
    container_name: ppdb-webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ppdb-network
    depends_on:
      - app

  # MySQL Database Server
  db:
    image: mysql:8.0
    container_name: ppdb-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ppdb_online}
      MYSQL_USER: ${DB_USERNAME:-ppdb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - ppdb-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Redis Cache & Session
  redis:
    image: redis:alpine
    container_name: ppdb-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - ppdb-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # phpMyAdmin Web Database Manager
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ppdb-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-ppdb_user}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - ppdb-network
    depends_on:
      db:
        condition: service_healthy

networks:
  ppdb-network:
    driver: bridge

volumes:
  mysqldata:
    driver: local
  redisdata:
    driver: local
